services:
  mrtklib-web-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        MRTKLIB_BRANCH: ${MRTKLIB_BRANCH:-main}
        # QC Preview support through cssrlib. Set INSTALL_QC=0 in .env to disable it.
        INSTALL_QC: ${INSTALL_QC:-1}
    ports:
      - "8080:8000"
    volumes:
      # Output files, presets, configs (read-write)
      - ${WORKSPACE_DIR:-./workspace}:/workspace:rw
      # Input GNSS data files (read-only)
      - ${DATA_DIR:-./data}:/data:ro
      # Optional: mount host .netrc for data download credentials
      # - ${NETRC_FILE:-/dev/null}:/root/.netrc:ro
      # CLAS Pipeline (Stream Server tab → CLAS Pipeline) needs serial
      # passthrough. Uncomment the lines below and set the device paths
      # in .env (CLAS_INPUT_DEVICE, CLAS_OUTPUT_DEVICE) — defaults to
      # ttyUSB0 (SBF in) and ttyUSB1 (RTCM3 out).
      # - /dev/serial:/dev/serial:ro
    environment:
      - PYTHONUNBUFFERED=1
      - EARTHDATA_USER=${EARTHDATA_USER:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - GSI_USER=${GSI_USER:-}
      - GSI_PASSWORD=${GSI_PASSWORD:-}
    # devices:
    #   - "${CLAS_INPUT_DEVICE:-/dev/ttyUSB0}:${CLAS_INPUT_DEVICE:-/dev/ttyUSB0}"
    #   - "${CLAS_OUTPUT_DEVICE:-/dev/ttyUSB1}:${CLAS_OUTPUT_DEVICE:-/dev/ttyUSB1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
