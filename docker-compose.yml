services:
  mrtklib-web-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        # Empty = the version pinned in .mrtklib-version
        MRTKLIB_BRANCH: ${MRTKLIB_BRANCH:-}
    ports:
      - "8080:8000"
    volumes:
      # Output files, presets, configs (read-write)
      - ${WORKSPACE_DIR:-./workspace}:/workspace:rw
      # Input GNSS data files (read-only)
      - ${DATA_DIR:-./data}:/data:ro
      # Optional: mount host .netrc for data download credentials
      # - ${NETRC_FILE:-/dev/null}:/home/mrtk/.netrc:ro
      # CLAS Pipeline (Stream Server tab → CLAS Pipeline) needs serial
      # passthrough of one bidirectional port (SBF/L6 out of the receiver,
      # RTCM3 back in). Uncomment the lines below and set the device path
      # in .env (CLAS_INPUT_DEVICE) — defaults to ttyUSB0.
      # - /dev/serial:/dev/serial:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Host user/group that owns WORKSPACE_DIR files (see .env.example)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - EARTHDATA_USER=${EARTHDATA_USER:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - GSI_USER=${GSI_USER:-}
      - GSI_PASSWORD=${GSI_PASSWORD:-}
    # devices:
    #   - "${CLAS_INPUT_DEVICE:-/dev/ttyUSB0}:${CLAS_INPUT_DEVICE:-/dev/ttyUSB0}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
